name: CI

on:
  push:
    branches: ['**']
    paths:
      - 'receipts-app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'receipts-app/**'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receipts-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: receipts-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

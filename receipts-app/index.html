<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Allow pinch-zoom for accessibility; cover the notch on modern phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Receipts — Save what you decided. Say what you need. A calm, local-first app for panic scripts, decision receipts, and personal rules. No account, no cloud, no tracking." />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Installable web app (iOS / Android) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Receipts" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Receipts — Save what you decided. Say what you need." />
    <meta property="og:description" content="A calm, local-first app for panic scripts, decision receipts, and personal rules. Everything stays on your device." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <title>Receipts — Save what you decided. Say what you need.</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color: #f5f2e9; font-family: sans-serif; padding: 2rem; text-align: center">
        Receipts needs JavaScript to run. Everything stays on your device — nothing is sent anywhere.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

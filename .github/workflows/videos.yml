name: Render Videos (MP4 + voiceover)

# Converts the committed WebM promo/demo into MP4 and a narrated MP4 variant.
# Run it from the Actions tab (workflow_dispatch), or it runs automatically when
# the videos or narration scripts change.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'receipts-app/promo/**'
      - 'receipts-app/demo/**'
      - 'receipts-app/scripts/narration/**'
      - 'receipts-app/scripts/videos/**'
      - '.github/workflows/videos.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: receipts-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg + espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Build MP4s (+ narrated variants)
        run: bash scripts/videos/make-mp4.sh

      - name: Upload videos (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: receipts-videos-mp4
          path: receipts-app/videos-mp4/*.mp4
          if-no-files-found: error

      - name: Commit MP4s back to the branch
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add receipts-app/videos-mp4/*.mp4
          if git diff --staged --quiet; then
            echo "No video changes to commit."
          else
            git commit -m "Render MP4 videos [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

